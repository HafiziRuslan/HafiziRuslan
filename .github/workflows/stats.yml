---
name: stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Kuala_Lumpur

permissions: {}

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate the user stats
        uses: cicirello/user-statistician@v1
        with:
          include-title: true
          custom-title: ${{ github.repository_owner }}
          small-title: false
          featured-repository: 'RasPiAPRS'
          max-languages: auto
          animated-language-chart: true
          language-animation-speed: 45
          colors: dark-dimmed
          border-radius: 1
          show-border: false
          image-width: 480
          hide-keys: mostStarred, mostForked, followers, following, watchedBy
          commit-message: 'stats'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
