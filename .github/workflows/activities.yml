---
name: activities

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Kuala_Lumpur

jobs:
  github-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: Readme-Workflows/recent-activity@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
