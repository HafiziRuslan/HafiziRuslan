---
name: trigger

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger-others:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflows
        uses: actions/github-script@main
        with:
          script: |
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const results = [];

            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const workflow of workflows.data.workflows) {
              const name = workflow.name.toLowerCase();

              if (name === "trigger" || name.includes("lint") || name.includes("push")) {
                console.log(`Skipping workflow: ${workflow.name}`);
                continue;
              }

              const startTime = Date.now();
              console.log(`Dispatching workflow: ${workflow.name}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                ref: '${{ github.ref }}'
              });

              await sleep(10000);

              let status = 'queued';
              let conclusion = 'unknown';

              while (status !== 'completed') {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  per_page: 1
                });

                if (runs.data.workflow_runs.length > 0) {
                  const latestRun = runs.data.workflow_runs[0];
                  status = latestRun.status;
                  conclusion = latestRun.conclusion;
                  console.log(`Workflow ${workflow.name} status: ${status}`);
                }

                if (status !== 'completed') {
                  await sleep(15000);
                }
              }
              const duration = Math.floor((Date.now() - startTime) / 1000);
              const durationStr = `${Math.floor(duration / 60)}m ${duration % 60}s`;

              results.push({ name: workflow.name, conclusion, duration: durationStr });
              console.log(`Workflow ${workflow.name} finished in ${durationStr}.`);
            }

            let summary = '### Trigger Summary\n\n| Workflow | Status | Duration |\n| :--- | :--- | :--- |\n';
            for (const res of results) {
              const icon = res.conclusion === 'success' ? '✅' : '❌';
              summary += `| ${res.name} | ${icon} ${res.conclusion} | ${res.duration} |\n`;
            }
            core.summary.addRaw(summary).write();
