name: lint

on: # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - gh-activity
      - metrics
      - stats
    types:
      - completed

permissions: {}

jobs:
  build:
    name: lint
    runs-on: ubuntu-latest

    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need to update commit status
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          # super-linter needs the full git history to get the list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@latest # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
