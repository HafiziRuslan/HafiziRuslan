---
name: lint

on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
  TZ: Asia/Kuala_Lumpur

permissions:
  contents: write

jobs:
  build:
    name: lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false

      - name: Commit lint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "30207509+github-actions[bot]@users.noreply.github.com"
          git add *
          git commit -m "lint" || exit 0
          git push
