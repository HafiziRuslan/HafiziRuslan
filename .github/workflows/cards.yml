name: cards

on:
  schedule:
    - cron: '0 0/4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: stats card
        uses: readme-tools/github-readme-stats-action@main
        with:
          card: stats
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "hide": "stars",
              "show": "prs_merged_percentage",
              "show_icons": true,
              "theme": "transparent",
              "hide_border": true,
              "rank_icon": "github",
              "include_all_commits": true
            }
          path: images/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: top-langs card
        uses: readme-tools/github-readme-stats-action@main
        with:
          card: top-langs
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "layout": "compact",
              "size_weight": 0.5,
              "count_weight": 0.5,
              "theme": "transparent",
              "hide_border": true
            }
          path: images/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: time card
        uses: readme-tools/github-readme-stats-action@main
        with:
          card: wakatime
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "hide_progress": true,
              "custom_title": "Time Stats",
              "layout": "compact"
            }
          path: images/time.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/*.svg
          git commit -m "cards" || exit 0
          git push
